# Memory-only mode: the database and uploads live in RAM and vanish when the container stops.
# Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ram.yml up -d
services:
  nonos:
    volumes: !reset []
    tmpfs:
      - /tmp
      - /data:rw,size=1024m,mode=0700,uid=1000,gid=1000
    # files in a tmpfs count against the container's memory, so leave room for a full /data
    mem_limit: 2g
