# Adds a Tor onion service in front of NONOS. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.tor.yml up -d
services:
  nonos:
    # No port on the host: an onion-only server must not also answer on its normal IP address.
    # To run next to an HTTPS proxy on the host, list a file that publishes the port after this one.
    ports: !reset []

  tor:
    build: ./deploy/tor
    restart: unless-stopped
    depends_on:
      - nonos
    volumes:
      - tor-keys:/var/lib/tor
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    # The entrypoint hands the key folder to Tor's user, then Tor drops to that user: these are
    # the only capabilities that takes, and none is kept once Tor runs.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  tor-keys:
