# Written by deploy/provision.sh. Keys only, no passwords, few attempts.
# Loaded before Ubuntu's own drop-ins (50-cloud-init.conf on Hetzner images turns passwords
# on), and sshd keeps the first value it reads, so these win.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitRootLogin @ROOT_LOGIN@
AllowUsers @ALLOW_USERS@
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
