# Hosted Nil: the control plane and Caddy. Workspaces are not listed here; the control plane
# creates one container per workspace through the Docker API.
#
# On the server this file is /opt/nil/docker-compose.yml, next to:
#   .env            image tags and host settings (deploy/hosted.env.example)
#   cloud.env       control plane settings (cloud/.env.example)
#   workspace.env   app settings every workspace shares (cloud/workspace.env.example)
# See cloud/README.md for the whole setup.
name: nil

services:
  control:
    image: ${NIL_CLOUD_IMAGE:-localhost/nonos/nil-cloud}:${NIL_VERSION:?set NIL_VERSION in .env}
    # release.sh ships the image over SSH; a missing one is an error, never a download
    pull_policy: never
    container_name: nil-control
    restart: unless-stopped
    env_file:
      - path: cloud.env
    # Set here rather than in cloud.env, so they always match the rest of this file.
    environment:
      CLOUD_APP_IMAGE: ${NIL_IMAGE:-localhost/nonos/nil}:${NIL_VERSION}
      CLOUD_DATA_DIR: /var/lib/nil-cloud
      CLOUD_CADDYFILE: /srv/caddy/Caddyfile
      CLOUD_CADDY_CONTAINER: nil-caddy
      # the egress service below; workspaces use it only with CLOUD_EGRESS_PROXY=on in cloud.env
      CLOUD_EGRESS_CONTAINER: nil-egress
      CLOUD_EGRESS_PROXY_PORT: "3128"
      CLOUD_CADDY_CONTROL: control:8080
      CLOUD_CADDY_ASK: control:8081
      CLOUD_PORT: "8080"
      CLOUD_INTERNAL_PORT: "8081"
      CLOUD_TRUST_PROXY: "1"
      CLOUD_APP_ENV_FILE: /etc/nil/workspace.env
      # the key Nil's verifier (docker-compose.verifier.yml) seals its answers with; every
      # workspace gets it as NOX_VERIFIER_KEY. Without it the verifier stays off.
      CLOUD_VERIFIER_KEY: ${VERIFIER_KEY:-}
      # the relay for calls (the turn service below) and the database of workspace secrets it reads
      CLOUD_TURN_CONTAINER: nil-turn
      CLOUD_TURN_DB: /var/lib/nil-turn/turndb
    # The Docker socket makes this container as powerful as root on the host: it has to be, to
    # create workspaces. Everything else is locked down, and nothing publishes its ports.
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the docker group id (getent group docker)}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control-data:/var/lib/nil-cloud
      - caddy-config:/srv/caddy
      - turn-db:/var/lib/nil-turn
      - ./workspace.env:/etc/nil/workspace.env:ro
      # The mounted backup share, for CLOUD_BACKUP_TARGET=file:///backups. rslave passes the
      # share through even when it is mounted (or mounted again) after this container started.
      - type: bind
        source: ${NIL_BACKUP_DIR:-/mnt/nil-backups}
        target: /backups
        bind:
          propagation: rslave
          create_host_path: true
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # no swap: setup codes, cloud.env's keys and a restore's backup key (in /tmp) stay in memory
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    # pinned by digest; a pull of the stock image can only ever fetch exactly this one
    image: ${CADDY_IMAGE:-caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb}
    container_name: nil-caddy
    restart: unless-stopped
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # only for CLOUD_TLS=wildcard; the generated Caddyfile reads them as {env.…}: the one
      # token most DNS modules take, or the four values of OVHcloud's (CLOUD_DNS_PROVIDER=ovh)
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
    volumes:
      # nocopy: Docker would copy Caddy's own root-owned /etc/caddy onto the empty volume, and the
      # control plane, which writes the Caddyfile there as uid 1000, couldn't
      - type: volume
        source: caddy-config
        target: /etc/caddy
        read_only: true
        volume:
          nocopy: true
      - caddy-data:/data
      - caddy-state:/config
    # edge: the control plane. chain: the verifier and the optional Ethereum node. The control plane attaches
    # Caddy to every workspace's own network as well.
    networks:
      - edge
      - chain
    # an Ethereum node running on the host itself is reachable as host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # no swap: TLS keys and the DNS token stay in memory
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 1024
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  egress:
    # The way out for workspaces with CLOUD_EGRESS_PROXY=on: an HTTP CONNECT proxy (egress.js) that
    # opens tunnels only to allowed ports on public addresses. The control plane attaches it to
    # each workspace network. It sees addresses and byte counts, never what's inside the tunnels.
    image: ${NIL_CLOUD_IMAGE:-localhost/nonos/nil-cloud}:${NIL_VERSION:?set NIL_VERSION in .env}
    pull_policy: never
    container_name: nil-egress
    restart: unless-stopped
    command: ["node", "--disable-warning=ExperimentalWarning", "egress.js"]
    # its settings come from .env, never from cloud.env, so none of the control plane's keys are here
    environment:
      CLOUD_EGRESS_PROXY_PORT: "3128"
      CLOUD_EGRESS_PROXY_ALLOW_PORTS: ${EGRESS_ALLOW_PORTS:-}
      CLOUD_EGRESS_PROXY_DENY: ${EGRESS_DENY:-}
      CLOUD_EGRESS_PROXY_PER_MINUTE: ${EGRESS_PER_MINUTE:-}
      CLOUD_EGRESS_PROXY_CONCURRENT: ${EGRESS_CONCURRENT:-}
      CLOUD_EGRESS_PROXY_CONNECT_SECONDS: ${EGRESS_CONNECT_SECONDS:-}
      CLOUD_EGRESS_PROXY_IDLE_SECONDS: ${EGRESS_IDLE_SECONDS:-}
      CLOUD_EGRESS_PROXY_MAX_SECONDS: ${EGRESS_MAX_SECONDS:-}
    networks:
      - egress
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3128, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  # The relay for calls, under the calls profile: COMPOSE_PROFILES=calls in .env, with
  # CLOUD_CALLS=on in cloud.env. Browsers in a call reach each other only through it, so nobody
  # learns anyone else's address, and their media is encrypted browser to browser before it gets
  # here. Each login is checked against the workspace secrets the control plane keeps in turn-db;
  # TLS on 5349 uses Caddy's wildcard certificate. The host's network, for the relay's port range.
  # Open 3478 (UDP and TCP), 5349 (TCP) and 49160 to 49999 (UDP) in the firewall.
  turn:
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    profiles:
      - calls
    container_name: nil-turn
    restart: unless-stopped
    depends_on:
      - control
    network_mode: host
    # root only to copy the certificate and set up the database folder; coturn itself runs as
    # nobody with no capabilities (deploy/coturn/hosted.sh)
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/coturn/hosted.sh"]
    # only the relay's own settings, never the control plane's. Not required here: Compose reads
    # every service's settings, also those of profiles that are off; the relay refuses to start
    # without it.
    environment:
      TURN_REALM: ${TURN_HOST:-}
      TURN_USERDB: /db/turndb
      TURN_DB_GID: "1000"
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-}
      TURN_LOG: ${TURN_LOG:-off}
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn/entrypoint.sh:/etc/coturn/entrypoint.sh:ro
      - ./deploy/coturn/hosted.sh:/etc/coturn/hosted.sh:ro
      - type: volume
        source: turn-db
        target: /db
        volume:
          nocopy: true
      - type: volume
        source: caddy-data
        target: /caddy
        read_only: true
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    # NET_BIND_SERVICE: the coturn image's turnserver carries it as a file capability, and Linux
    # won't run a program whose file capabilities fall outside the container's set
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Caddy publishes 80 and 443 from here. With the userland proxy off (see
  # deploy/host/docker-daemon.json), Docker forwards the host's IPv6 ports only to a container's
  # IPv6 address, so this network has one: a private ULA /64 Docker picks. Visitors keep their own
  # IPv6 address as their source. Workspace networks stay IPv4 only.
  edge:
    enable_ipv6: true
  # Only Caddy, the verifier (docker-compose.verifier.yml) and the optional Ethereum node
  # (docker-compose.chain.yml) join this one.
  chain:
    internal: true
  # Only the egress proxy joins this one: an ordinary bridge with a route out, apart from the
  # control plane and Caddy.
  egress: {}

volumes:
  control-data:
  caddy-config:
  caddy-data:
  caddy-state:
  turn-db:
