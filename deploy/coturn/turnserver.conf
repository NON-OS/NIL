# coturn for Nil calls: a relay that passes encrypted call media between browsers, so nobody in
# a call learns anyone else's IP address. It never sees what's said or shown: media is
# encrypted browser to browser (DTLS-SRTP) before it reaches the relay.
#
# entrypoint.sh adds what differs per server (addresses, realm, certificate, the shared secret)
# from the environment, so no secret is ever written into this file.

# Passwords come from Nil: HMAC of an expiring username under the secret both share.
use-auth-secret
fingerprint
stale-nonce=600

# No admin console, no anonymous use, and nothing that answers more than a TURN client needs.
no-cli
no-rfc5780
no-software-attribute
no-multicast-peers

# Plain TURN on 3478 for networks that allow UDP, TLS on 5349 for the ones that only let HTTPS
# through. Relayed media leaves on UDP; the relay never opens TCP connections onward. coturn
# 4.18, the version docker-compose.yml runs, already leaves out TLS 1.0 and 1.1, DTLS
# listeners and the old STUN attributes unless asked for them.
listening-port=3478
tls-listening-port=5349
no-tcp-relay
cipher-list=ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256

# The ports relayed media uses. Open the same range, UDP, in the firewall.
min-port=49160
max-port=49999

# Quotas: sessions per person (a call of six needs five, with room for a restart), sessions in
# all, and bandwidth per session in bytes a second (about 4 Mbit/s), so one person can't use the
# relay up for everyone.
user-quota=12
total-quota=1200
max-bps=500000
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# The relay may only send to public addresses: never to this machine, its private network, or
# anything link-local, so it can't be used to reach the host or what sits beside it.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::-::ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quiet by default: coturn logs the address of everyone who connects. entrypoint.sh turns the
# log on with TURN_LOG=on, for while something needs looking into.
simple-log
