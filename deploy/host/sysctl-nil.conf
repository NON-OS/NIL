# Written by deploy/provision.sh.

# Memory: prefer dropping cache to swapping out running apps; swap is a safety net only.
vm.swappiness = 10
# Reth maps its database into memory and needs many mappings.
vm.max_map_count = 1048576

# Hundreds of containers each watch files and open sockets.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
fs.file-max = 2097152
net.core.somaxconn = 4096
net.netfilter.nf_conntrack_max = 524288

# Caddy's HTTP/3 (QUIC) wants larger UDP buffers than the default.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# Network hardening. Forwarding stays on: Docker needs it.
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.log_martians = 1

# Kernel hardening: no kernel pointers or ring buffer for unprivileged users, no unprivileged
# BPF, hardened BPF JIT.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.yama.ptrace_scope = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
