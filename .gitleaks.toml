# Values that look like secrets to gitleaks but are public by design: file digests in release
# manifests and ceremony records, published test vectors, contract addresses, the name of the
# receipt key file, and the made-up keys tests use. Anything else it finds is a real problem.
[extend]
useDefault = true

[allowlist]
description = "Public values: build digests, test vectors, contract addresses"
paths = [
  '''^release/.*\.json$''',
  '''^circuits/CEREMONY\.json$''',
  '''^scripts/(zk-fetch|pools-fetch|zk-ballot)\.mjs$''',
  '''^server/test/fixtures/''',
  '''^client/test/fixtures/''',
  '''^formal/vectors/''',
]
regexes = [
  '''0x[0-9a-fA-F]{40}''',
  '''receipts-ed25519\.pem''',
  '''-0123456789abcdef''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''BOr6U4rS1oWm5gK8E3nH7Z3qV0yXbT9pL2cJ6dF8aR1sW4uY7iK0oP3lM5nB2vC9xZ6aQ8wE1rT4yU7iO0pA3sD''',
  '''q83Jv3H5c1M2k4L6n8P0rQ''',
]
