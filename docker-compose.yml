services:
  nonos:
    build: .
    image: nonos:latest
    restart: unless-stopped
    ports:
      # Loopback only. Put a TLS proxy in front, such as Caddy (docs/deploy.md, step 6): Nil
      # speaks plain HTTP and should never face the internet directly.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - nonos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # more than SHUTDOWN_TIMEOUT_SECONDS (20 by default), so Nil can finish open requests and
    # close the database before Docker kills it
    stop_grace_period: 30s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Nil's verifier, off unless you ask for it with COMPOSE_PROFILES=verifier (docs/self-hosting.md,
  # "Verified chain reads"). Its settings go in verifier.env, apart from .env, so it never holds
  # the app's secrets: the VERIFIER_ lines of .env.example. Then, in .env, set NOX_VERIFIER_KEY to
  # the same value as VERIFIER_KEY and NOX_VERIFIER_MODE=shadow with
  # NOX_VERIFIER_URL=http://verifier:8545, or enforce with NOX_RPC_URL=http://verifier:8545.
  verifier:
    build: .
    image: nonos:latest
    profiles:
      - verifier
    restart: unless-stopped
    command: ["node", "server/verifier/index.js"]
    env_file:
      - path: verifier.env
        required: false
    environment:
      VERIFIER_DATA_DIR: /data
    volumes:
      - verifier-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8545/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The relay for calls, off unless you ask for it with COMPOSE_PROFILES=calls (docs/calls.md,
  # "Set up calls"). It uses the host's network, since it hands out thousands of UDP ports and
  # must see the addresses browsers really come from. Its settings are deploy/coturn plus the
  # TURN_ lines of .env; the secret is the same TURN_SECRET Nil uses. Put the relay host's TLS
  # certificate and key in TURN_CERT_DIR as fullchain.pem and privkey.pem, readable by coturn.
  coturn:
    image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    profiles:
      - calls
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/etc/coturn/entrypoint.sh"]
    # only the relay's own settings, taken from .env by name: never the app's other secrets,
    # on a service that faces the internet
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_ALLOWED_PEER_IP: ${TURN_ALLOWED_PEER_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-}
      TURN_LOG: ${TURN_LOG:-off}
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./deploy/coturn/entrypoint.sh:/etc/coturn/entrypoint.sh:ro
      - ${TURN_CERT_DIR:-./deploy/coturn/certs}:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # the coturn image's turnserver carries it as a file capability, and Linux won't run a
    # program whose file capabilities fall outside the container's set
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The SFU for calls too big to go browser to browser (CALL_MESH_MAX_PEERS), under the calls
  # profile with coturn. It forwards frames the browsers encrypted under keys it never holds.
  # Browsers reach its signalling through Caddy at SFU_URL and its media only through coturn.
  livekit:
    image: livekit/livekit-server:v1.9.12@sha256:2c13cbf2edcbf13ea7b20d05c10b394d04d8fb3fe358269cff845a90b4de9576
    profiles:
      - calls
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    # only its own key pair, never the app's other secrets
    environment:
      LIVEKIT_KEYS: "${SFU_API_KEY:-}: ${SFU_API_SECRET:-}"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  nonos-data:
    # a fixed name, so backups and restores find it whatever folder the code is in; it's the
    # name Compose gave it before, so existing servers keep their data
    name: nonos_nonos-data
  verifier-data:
