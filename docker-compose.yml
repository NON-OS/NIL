services:
  nonos:
    build: .
    image: nonos:latest
    restart: unless-stopped
    ports:
      # Loopback only. Put a TLS proxy in front, such as Caddy (docs/deploy.md, step 6): Nil
      # speaks plain HTTP and should never face the internet directly.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - nonos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # more than SHUTDOWN_TIMEOUT_SECONDS (20 by default), so Nil can finish open requests and
    # close the database before Docker kills it
    stop_grace_period: 30s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  nonos-data:
