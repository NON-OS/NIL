name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit, so a moved tag can't change what runs here.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:quality
      - run: npm run build
      - run: npm audit --omit=dev

  # The Lean proofs in formal/: build, axiom check, and the committed test vectors must be what
  # the models produce today. elan is pinned by version and checksum; it installs the Lean
  # version named in formal/lean-toolchain.
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install elan
        env:
          ELAN_VERSION: v4.1.2
          ELAN_SHA256: f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b
        run: |
          curl -fsSL -o elan.tar.gz "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  elan.tar.gz" | sha256sum -c -
          tar xzf elan.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          rm elan-init elan.tar.gz
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm run formal
      - name: Check the committed vectors are current
        run: git diff --exit-code formal/vectors

  # The hosted control plane has its own dependencies and tests; the deploy scripts it uses
  # must stay shellcheck-clean.
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Check the deploy scripts
        working-directory: .
        run: shellcheck deploy/*.sh

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Build the image
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "SCHEMA=$(node --input-type=module -e "const { default: m } = await import('./server/db/migrations.js'); console.log(m.length)")" >> "$GITHUB_ENV"
          docker build --build-arg VERSION="$(node -p "require('./package.json').version")" -t nil:ci .

      - name: Check the image labels
        run: test "$(docker image inspect nil:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"

      # A fresh install the way the compose file runs it, with STRICT_CONFIG so any config
      # warning fails the build. PORT is moved off 3000 to prove the healthcheck follows it.
      - name: Smoke test a fresh install
        run: |
          docker run -d --name fresh --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e STRICT_CONFIG=1 -e NOX_RPC_URL=off -e APP_URL=http://localhost:8080 -e PORT=8080 \
            --health-interval 2s -p 127.0.0.1:8080:8080 nil:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz > health.json && break; sleep 1; done
          cat health.json
          jq -e --arg v "$VERSION" --argjson s "$SCHEMA" '.ok == true and .version == $v and .schema == $s and .chain.enabled == false' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          for i in $(seq 15); do [ "$(docker inspect fresh --format '{{.State.Health.Status}}')" = healthy ] && break; sleep 1; done
          test "$(docker inspect fresh --format '{{.State.Health.Status}}')" = healthy
          docker stop fresh
          docker logs fresh
          test "$(docker inspect fresh --format '{{.State.ExitCode}}')" = 0

      # The 3.0.0 database fixture, upgraded by the image to the latest schema, with the copy
      # taken before the upgrade left beside it.
      - name: Upgrade a 3.0.0 database
        run: |
          docker volume create upgrade
          docker run --rm --user root -v upgrade:/data -v "$PWD/server/test/fixtures/v3.0.0.db:/fixture.db:ro" \
            --entrypoint install nil:ci -o node -g node -m 600 /fixture.db /data/nonos.db
          docker run -d --name upgrade -v upgrade:/data -e STRICT_CONFIG=1 -e NOX_RPC_URL=off -e APP_URL=http://localhost:3000 \
            -p 127.0.0.1:3000:3000 nil:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:3000/healthz > health.json && break; sleep 1; done
          cat health.json
          jq -e --argjson s "$SCHEMA" '.ok == true and .schema == $s' health.json
          docker logs upgrade 2>&1 | grep -q 'Upgraded the database from schema 16'
          docker run --rm -v upgrade:/data --entrypoint ls nil:ci /data | grep -q '^pre-migration-.*-schema-16\.db$'
          docker stop upgrade
          test "$(docker inspect upgrade --format '{{.State.ExitCode}}')" = 0

  # The calls check in Safari's engine, with coturn. Playwright can't give WebKit a camera or
  # microphone, so its people join without them and the SFU is left to calls-chromium.
  calls-webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - run: npx playwright-core install --with-deps webkit
      - name: Calls check in WebKit
        run: node scripts/calls/check.mjs --browser webkit

  # The whole calls check, fake camera and microphone, coturn and the SFU, in Chromium. LiveKit is
  # built from its Go module at 1.9.12, which the Go checksum database pins.
  calls-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y coturn
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.6
          cache: false
      - name: Build LiveKit 1.9.12
        run: |
          GOBIN="$RUNNER_TEMP/livekit" go install github.com/livekit/livekit-server/cmd/server@v1.9.12
          mv "$RUNNER_TEMP/livekit/server" "$RUNNER_TEMP/livekit/livekit-server"
      - run: npx playwright-core install --with-deps chromium
      - name: Calls check in Chromium, SFU included
        env:
          LIVEKIT_SERVER: ${{ runner.temp }}/livekit/livekit-server
        run: node scripts/calls/check.mjs --browser chromium
